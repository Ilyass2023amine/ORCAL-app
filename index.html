<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Oracle ∞</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,300;0,500;1,300&display=swap">
<style>
:root{--void:#0a0620;--mist:#e9e4ff;--dim:#a79fd0;--aurora:#5df2d6;--arcane:#b46bff;--ember:#ffc86b;--blood:#ff6b9d;--glass:rgba(24,14,60,.62);--edge:rgba(180,107,255,.4)}
*{box-sizing:border-box;margin:0}
body{background:var(--void);color:var(--mist);font:300 1.06rem/1.55 "Spectral",Georgia,serif;overflow-x:hidden;min-height:100vh}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene{position:fixed;inset:0;z-index:1;perspective:900px;pointer-events:none;overflow:hidden}
#world{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.o{position:absolute;left:0;top:0;transform-style:preserve-3d}
.cube{position:absolute;transform-style:preserve-3d;animation:cs 26s linear infinite}
.f{position:absolute;inset:0;border:1px solid var(--arcane);background:rgba(180,107,255,.07);box-shadow:inset 0 0 40px rgba(93,242,214,.25),0 0 20px rgba(180,107,255,.3)}
.f:nth-child(1){transform:translateZ(var(--h))}.f:nth-child(2){transform:rotateY(90deg) translateZ(var(--h))}.f:nth-child(3){transform:rotateY(180deg) translateZ(var(--h))}
.f:nth-child(4){transform:rotateY(-90deg) translateZ(var(--h))}.f:nth-child(5){transform:rotateX(90deg) translateZ(var(--h))}.f:nth-child(6){transform:rotateX(-90deg) translateZ(var(--h))}
.ring{position:absolute;border-radius:50%;border:2px solid var(--aurora);box-shadow:0 0 30px var(--aurora),inset 0 0 30px var(--aurora);opacity:.45}
@keyframes cs{from{transform:rotateX(20deg) rotateY(0)}to{transform:rotateX(20deg) rotateY(360deg)}}
@keyframes r1{from{transform:rotateX(70deg) rotateZ(0)}to{transform:rotateX(70deg) rotateZ(360deg)}}
@keyframes r2{from{transform:rotateY(70deg) rotateZ(0)}to{transform:rotateY(70deg) rotateZ(-360deg)}}
body[data-gfx=low] #scene,body.rm #scene{display:none}body[data-gfx=med] .rg{display:none}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(93,242,214,.5),rgba(180,107,255,.3) 45%,transparent 70%)}
#flash.on{animation:fa .7s}@keyframes fa{30%{opacity:.5}to{opacity:0}}
main{position:relative;z-index:2;max-width:740px;margin:0 auto;padding:2rem 1rem 3rem}
h1,h2,h3{font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:.06em;text-align:center}
h1{font-size:clamp(2rem,7vw,3rem);background:linear-gradient(90deg,var(--aurora),var(--arcane),var(--ember),var(--aurora));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fl 9s linear infinite;filter:drop-shadow(0 0 14px rgba(180,107,255,.6))}
@keyframes fl{to{background-position:300% 0}}
h2{font-size:1.3rem;color:var(--ember);text-shadow:0 0 12px rgba(255,200,107,.5);margin-bottom:.6rem}
h3{font-size:1rem;color:var(--aurora);text-align:left;margin:1.2rem 0 .3rem}
.sub{text-align:center;color:var(--dim);font-style:italic;margin:.4rem 0 1.5rem}
#tilt{perspective:1000px}
#app{background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:1.5rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 50px rgba(120,60,255,.3),inset 0 0 30px rgba(93,242,214,.06);animation:en .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes en{from{opacity:0;filter:blur(8px);transform:rotateY(-24deg) translateZ(-140px) scale(.94)}to{opacity:1;filter:none;transform:none}}
button{font:inherit;font-weight:500;color:var(--mist);cursor:pointer;position:relative;background:rgba(60,35,130,.45);border:1px solid var(--edge);border-radius:14px;padding:.85rem 1.05rem;transition:transform .25s,box-shadow .25s,border-color .25s}
button:hover:not(:disabled),button:focus-visible{border-color:var(--aurora);box-shadow:0 0 24px rgba(93,242,214,.45);transform:translateY(-3px) scale(1.02)}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
h2:focus-visible,.q:focus-visible,#app:focus-visible{outline:none}
button:disabled{cursor:default}
button.sel{border-color:var(--c,var(--ember));background:rgba(255,255,255,.1);box-shadow:0 0 26px var(--c,var(--ember))}
.menu{display:grid;gap:.9rem;margin:1rem 0}
.menu button{text-align:left;display:flex;gap:1rem;align-items:center}
.ic{font-size:1.9rem;filter:drop-shadow(0 0 10px var(--arcane))}
small{display:block;color:var(--dim);font-weight:300;font-size:.88rem}
.cta{display:block;width:100%;margin-top:1rem;text-align:center;background:linear-gradient(135deg,#6a2fd6,#1fa8a0);border:0;font-family:"Cinzel",serif;letter-spacing:.08em;box-shadow:0 0 24px rgba(180,107,255,.5)}
.cta:disabled{opacity:.4}
.ghost{background:none;font-size:.9rem;padding:.4rem .8rem;margin-top:.8rem}
.bar,.tb{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-bottom:1rem;overflow:hidden}
.bar i,.tb i{display:block;height:100%;background:linear-gradient(90deg,var(--arcane),var(--aurora));box-shadow:0 0 12px var(--aurora);transition:width .5s}
.tb i{width:100%;transition:none;background:linear-gradient(90deg,var(--ember),var(--aurora))}
.meta{display:flex;justify-content:space-between;color:var(--dim);font-size:.9rem}
.q{font-size:1.2rem;margin:.6rem 0 1rem;text-align:center}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem;margin-bottom:1.2rem}
.mx{display:grid;grid-template-columns:repeat(3,64px);gap:.4rem;justify-content:center;margin-bottom:1.2rem}.mx .cell{width:64px;height:64px}
.cell{width:84px;height:84px;display:grid;place-items:center;border-radius:14px;background:rgba(8,4,26,.6);border:1px solid var(--edge);box-shadow:0 0 18px rgba(180,107,255,.2);animation:pop .6s both}
.cell svg{max-width:100%;max-height:100%;filter:drop-shadow(0 0 6px currentColor)}
.cell:nth-child(2){animation-delay:.08s}.cell:nth-child(3){animation-delay:.16s}.cell:nth-child(4){animation-delay:.24s}.cell:nth-child(5){animation-delay:.32s}
@keyframes pop{from{opacity:0;transform:translateZ(-200px) rotateX(60deg)}to{opacity:1;transform:none}}
.cell.qm{font:700 2rem "Cinzel",serif;color:var(--ember);border-color:var(--ember);animation:pop .6s .4s both,pl 1.8s 1s infinite}
@keyframes pl{50%{box-shadow:0 0 30px var(--ember)}}
.num{font:700 1.4rem "Cinzel",serif;color:var(--aurora);text-shadow:0 0 12px var(--aurora)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem}
.opt{display:grid;place-items:center;padding:.5rem;min-height:88px}
.opt.ok{border-color:var(--aurora);box-shadow:0 0 30px var(--aurora);background:rgba(31,168,160,.3)}
.opt.no{border-color:var(--blood);box-shadow:0 0 30px var(--blood);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint-b{background:none;font-size:.9rem;display:block;margin:1rem auto 0}
.fb{text-align:center;margin-top:1rem}.fb p{color:var(--dim);font-style:italic;font-size:.95rem}
.ok-t{color:var(--aurora);text-shadow:0 0 12px var(--aurora)}.no-t{color:var(--blood);text-shadow:0 0 12px var(--blood)}
.big{font:700 clamp(2.6rem,12vw,4.2rem) "Cinzel",serif;text-align:center;color:var(--ember);text-shadow:0 0 30px rgba(255,200,107,.75)}
.stats{display:flex;justify-content:center;gap:1.2rem;color:var(--dim);flex-wrap:wrap;font-size:.95rem}.stats b{color:var(--mist);font-weight:500}
.note{color:var(--dim);font-size:.85rem;text-align:center;margin-top:1rem;font-style:italic}
.chk{display:flex;gap:.7rem;align-items:center;margin:.8rem 0;font-size:.95rem}.chk input{accent-color:var(--arcane);width:18px;height:18px}.chk input[type=range]{width:100%}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-top:1.2rem}.lk button{padding:.7rem .3rem;font-size:.82rem;text-align:center;min-height:62px}
.ax{display:grid;grid-template-columns:1.6rem 1fr 1.6rem;gap:.6rem;align-items:center;margin-top:.9rem;font-family:"Cinzel",serif;color:var(--ember)}
.ax span:last-child{text-align:right}.ax div{height:12px;border-radius:12px;background:rgba(255,255,255,.1);overflow:hidden;display:flex}
.ax i{display:block;height:100%;transition:width 1.2s .3s}.ax i:first-child{background:linear-gradient(90deg,var(--arcane),#d9a6ff)}.ax i:last-child{background:linear-gradient(90deg,#7ff7e3,var(--aurora))}
details{margin:.3rem 0;color:var(--dim);font-size:.92rem}summary{cursor:pointer;color:var(--mist)}details li{margin:.3rem 0 0 1.2rem}
.rep p,.rep li{font-size:.98rem;margin:.3rem 0}.rep ul{margin-left:1.2rem}
.warn{border:1px solid var(--edge);border-radius:12px;padding:.8rem 1rem;color:var(--dim);font-size:.9rem;margin-top:1rem;background:rgba(0,0,0,.2)}
svg.radar text{fill:var(--mist);font:600 13px "Cinzel",serif}
.gear{position:fixed;top:12px;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;padding:0;font-size:1.3rem}
#set{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(5,2,18,.75);backdrop-filter:blur(6px);padding:1rem}#set.open{display:grid}
.panel{background:#150c38;border:1px solid var(--edge);border-radius:20px;padding:1.5rem;width:100%;max-width:400px;box-shadow:0 0 60px rgba(120,60,255,.4)}
.seg{display:flex;gap:.4rem;margin:.4rem 0}.seg button{flex:1;padding:.5rem}.lab{color:var(--dim);font-size:.9rem;margin-top:.8rem}
#app.quick{animation-duration:.35s}
.load{display:flex;gap:.8rem;align-items:center;justify-content:center;padding:2rem;color:var(--dim)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--edge);border-top-color:var(--aurora);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin:1rem 0}.chips span{border:1px solid var(--edge);border-radius:999px;padding:.25rem .8rem;font-size:.88rem;color:var(--dim)}
.exit{padding:.15rem .6rem;font-size:.8rem;margin-left:.5rem;background:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-bottom:.6rem}
.rep ol li{margin:.5rem 0}
body.rm *{animation:none!important;transition:none!important}
@media(max-width:520px){.cell{width:58px;height:58px}.lk{grid-template-columns:1fr}.lk button{min-height:0}.grid{gap:.45rem}}

/* ===== v5: hub, games, RTL ===== */
.langbar{display:flex;gap:.4rem;justify-content:center;margin-bottom:1rem}.langbar button{padding:.3rem .9rem;font-size:.85rem;border-radius:999px}
.gm{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin:1rem 0}
.gm button{display:block;text-align:start;min-height:128px}.gm .ic{display:block;margin-bottom:.3rem;font-size:1.7rem}
.gm b{font-family:"Cinzel",serif;font-size:.92rem;display:block}.gm small{margin-top:.25rem}.gm em{display:block;color:var(--ember);font-style:normal;font-size:.8rem;margin-top:.4rem}
.menu button{text-align:start}.ltr{direction:ltr;unicode-bidi:isolate}
.seq,.mx,.num,.big{direction:ltr}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;max-width:380px;margin:1rem auto}
.mc{aspect-ratio:1;font-size:1.9rem;padding:0;background:none;border:0;perspective:600px}
.mc i{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;border:1px solid var(--edge);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s;font-style:normal}
.mc .bk{background:linear-gradient(135deg,#2b1665,#143a55)}.mc .fr{transform:rotateY(180deg);background:rgba(8,4,26,.85)}
.mc.up .bk{transform:rotateY(180deg)}.mc.up .fr{transform:none}.mc.ok .fr{border-color:var(--aurora);box-shadow:0 0 20px var(--aurora)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;max-width:320px;margin:1rem auto}
.pad{aspect-ratio:1;border-radius:22px;background:var(--p);color:var(--p);opacity:.5;padding:0;border:2px solid transparent}
.pad.lit{opacity:1;box-shadow:0 0 44px currentColor;transform:scale(1.05)}
.tiles{display:grid;gap:.4rem;max-width:340px;margin:1rem auto}.tile{aspect-ratio:1;font:700 1.5rem "Cinzel",serif;padding:0}.tile.blank{visibility:hidden}
.lights{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;max-width:340px;margin:1rem auto}
.lt{aspect-ratio:1;padding:0;border-radius:12px;background:rgba(8,4,26,.7)}.lt.on{background:radial-gradient(circle,#ffe9a8,var(--ember));box-shadow:0 0 22px var(--ember)}
.react{width:100%;min-height:220px;border-radius:20px;font:700 1.3rem "Cinzel",serif;margin-top:.5rem;padding:1rem}
.react.wait{background:rgba(255,107,157,.25);border-color:var(--blood)}.react.go{background:rgba(93,242,214,.45);border-color:var(--aurora);box-shadow:0 0 50px var(--aurora)}
.gear{right:auto;inset-inline-end:12px}
.meta+.bar{margin-top:.25rem}.meta b{color:var(--mist);font-weight:500}
[dir=rtl] .ax span:last-child{text-align:left}[dir=rtl] .ax span:first-child{text-align:right}
[lang=ar] body,[lang=ar] button,[lang=ar] input,[lang=ar] h2,[lang=ar] h3,[lang=ar] .cta,[lang=ar] .gm b,[lang=ar] .react{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;letter-spacing:0}
[lang=ar] body{line-height:1.75}
@media(max-width:520px){.gm{grid-template-columns:1fr}.gm button{min-height:0}}

/* ===== v6: progression, dialogs, a11y ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{touch-action:manipulation}
.player{border:1px solid var(--edge);border-radius:16px;padding:.8rem 1rem;background:rgba(8,4,26,.45);margin-bottom:.8rem}
.player .bar{margin:.4rem 0 0}.meta{gap:.6rem}.stats b,.meta b,.big{unicode-bidi:isolate}
.daily{display:flex;justify-content:space-between;align-items:center;gap:.8rem;border:1px solid var(--edge);border-radius:16px;padding:.8rem 1rem;margin-bottom:1rem;background:linear-gradient(135deg,rgba(106,47,214,.25),rgba(31,168,160,.18))}
.daily small{display:block;color:var(--dim);font-size:.88rem}.daily button{flex:none}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.8rem 0}
.sg div{border:1px solid var(--edge);border-radius:12px;padding:.6rem .8rem;background:rgba(8,4,26,.4)}.sg b{display:block;font-size:1.3rem;color:var(--ember);font-weight:500}
.rw{margin:.6rem 0}.rw p{margin:.2rem 0}.xp{color:var(--ember);font-weight:500;font-size:1.1rem}
.alist,.hlist{list-style:none;padding:0;margin:.4rem 0}.alist{display:grid;gap:.5rem}
.alist li{display:flex;gap:.7rem;align-items:center;border:1px solid var(--edge);border-radius:12px;padding:.5rem .8rem;opacity:.55}
.alist li.on{opacity:1;border-color:var(--ember)}.alist li>span{font-size:1.5rem}.alist li div{flex:1}.alist b{font-weight:500}.alist em{font-style:normal;color:var(--dim);font-size:.8rem}
.hlist li{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;border-bottom:1px solid rgba(180,107,255,.15);padding:.35rem 0;font-size:.9rem}.hlist em{font-style:normal;color:var(--ember)}
.hintline{text-align:center;color:var(--dim);font-size:.9rem;margin:.4rem 0 .8rem}
#toasts{position:fixed;inset-inline:0;bottom:14px;z-index:12;display:flex;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none}
.toast{background:#150c38;border:1px solid var(--ember);border-radius:12px;padding:.5rem 1rem;box-shadow:0 0 24px rgba(255,200,107,.35);animation:en .4s both;max-width:90vw;text-align:center}
#dlg{position:fixed;inset:0;z-index:11;display:none;place-items:center;background:rgba(5,2,18,.78);backdrop-filter:blur(6px);padding:1rem}#dlg.open{display:grid}
@media(max-width:520px){.daily{flex-direction:column;align-items:stretch;text-align:center}}
</style>
</head>
<body data-gfx="high">
<canvas id="fx" aria-hidden="true"></canvas>
<div id="scene" aria-hidden="true"><div id="world">
  <div class="o" data-b="-440,-150,-300" data-d="1"><div class="cube" style="--h:110px;width:220px;height:220px;left:-110px;top:-110px"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i></div></div>
  <div class="o" data-b="460,180,-180" data-d="1.8"><div class="cube" style="--h:70px;width:140px;height:140px;left:-70px;top:-70px;animation-duration:18s;animation-direction:reverse"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i></div></div>
  <div class="o rg" data-b="0,0,-520" data-d=".5">
    <div class="ring" style="width:900px;height:900px;left:-450px;top:-450px;animation:r1 40s linear infinite"></div>
    <div class="ring" style="width:680px;height:680px;left:-340px;top:-340px;border-color:var(--arcane);box-shadow:0 0 30px var(--arcane),inset 0 0 30px var(--arcane);animation:r2 30s linear infinite"></div>
    <div class="ring" style="width:460px;height:460px;left:-230px;top:-230px;border-color:var(--ember);box-shadow:0 0 30px var(--ember),inset 0 0 30px var(--ember);animation:r1 22s linear infinite reverse"></div>
  </div>
</div></div>
<div id="flash"></div>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>

</div></div>

  <label class="chk"><input type="checkbox" id="snd"><span data-i="set_snd">Sound effects</span></label>
  <label class="chk"><span data-i="set_vol">Volume</span><input type="range" id="vol" min="0" max="100"></label>

</div></div>

</main>
<script>
/* ===== i18n core ===== */
const I18N=(()=>{const D={};let lang="en";
  const raw=k=>{const v=D[lang]&&D[lang][k];return v!==undefined?v:D.en&&D.en[k]};
  return{add:(l,o)=>{D[l]=Object.assign(D[l]||{},o)},raw,has:l=>!!D[l],keys:l=>Object.keys(D[l]||{}),get lang(){return lang},
    set(l){lang=D[l]?l:"en";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr"},
    t:(k,...a)=>{const s=raw(k);return typeof s!=="string"?String(k):s.replace(/\{(\d)\}/g,(_,i)=>a[i]===undefined?"":a[i])}}})();
/* ===== dictionaries: English, Arabic, French ===== */
I18N.add("en",{
title:"The Oracle ∞ – Games of logic, memory and reflection",sub:"Games of logic, memory and reflection",loading:"Summoning the Oracle…",
wel_h:"Welcome, seeker",wel_p:"Play eight games of logic, memory, speed and reflection. Everything runs in your browser and nothing is uploaded.",

Q:["أشعر بالنشاط بعد قضاء وقت في مجموعة مفعمة بالحيوية.","أحتاج إلى وقت هادئ بمفردي لأستعيد طاقتي بعد يوم حافل.","غالباً ما أفكر بأفضل صورة حين أتحدث عن الأمور بصوت عالٍ.","أفضّل الأحاديث العميقة بين شخصين على التجمعات الكبيرة.","أبدأ الحديث مع الغرباء بسهولة.","عادةً أفكر بعناية قبل أن أتكلم.","أثق بالحقائق الملموسة والخبرة السابقة أكثر من الحدس.","تجذبني الأنماط والنظريات وما يمكن أن يحدث.","ألاحظ تفاصيل عملية صغيرة يغفل عنها الآخرون.","يقفز ذهني كثيراً إلى أفكار وروابط مستقبلية.","أحب التعليمات الواضحة خطوة بخطوة.","أستمتع بالتجريب دون طريقة محددة مسبقاً.","في الخلافات أركّز على ما هو صحيح منطقياً.","أفكر أولاً في أثر القرار على مشاعر الناس.","أستطيع وضع مشاعري جانباً لاتخاذ قرار صعب.","أستشعر ما يشعر به الآخرون دون أن يخبروني.","أُقدّر العدالة والاتساق أكثر من الاستثناءات الفردية.","قد أتجاوز قاعدة لأحمي شخصاً أهتم به.","أشعر بتحسن حين يكون ليومي خطة واضحة.","أحب إبقاء خياراتي مفتوحة أطول وقت ممكن.","أنهي مهامي قبل الموعد النهائي بوقت طويل.","أقدّم أفضل ما عندي في اندفاعات اللحظة الأخيرة.","أحب أن تكون القرارات محسومة ومغلقة.","أستمتع بالتكيّف حين تتغير الخطط."],
L:{E:["الانبساط","تميل إلى استمداد طاقتك من الناس والنشاط، وغالباً ما تفكر وأنت تتحدث.","تكوّن العلاقات بسرعة وتمنح المجموعات زخماً.","قد تتكلم قبل أن تتأمل، أو تجد الفترات الطويلة وحدك مُرهِقة.","أضف وقفات قصيرة للتفكير قبل القرارات الكبيرة."],

Q:["Je me sens revigoré(e) après un moment dans un groupe animé.","J’ai besoin de calme et de solitude pour récupérer après une journée chargée.","Je réfléchis souvent mieux en parlant à voix haute.","Je préfère les discussions profondes à deux aux grandes réunions.","J’engage facilement la conversation avec des inconnus.","Je réfléchis généralement avec soin avant de parler.","Je fais plus confiance aux faits concrets et à l’expérience qu’à l’intuition.","Je suis attiré(e) par les schémas, les théories et les possibilités.","Je remarque de petits détails pratiques que les autres manquent.","Mon esprit saute souvent vers des idées et des liens futurs.","J’aime les consignes claires, étape par étape.","J’aime expérimenter sans méthode fixe.","Dans un désaccord, je me concentre sur ce qui est logiquement juste.","Je pense d’abord à l’effet d’une décision sur les sentiments des gens.","Je peux mettre mes émotions de côté pour trancher.","Je sens ce que les autres ressentent sans qu’on me le dise.","Je valorise l’équité et la cohérence plus que les exceptions au cas par cas.","J’enfreindrais une règle pour protéger quelqu’un qui compte pour moi.","Je me sens mieux quand ma journée suit un plan clair.","J’aime garder mes options ouvertes le plus longtemps possible.","Je termine mes tâches bien avant l’échéance.","Je travaille mieux dans des élans de dernière minute.","J’aime que les décisions soient réglées et closes.","J’aime m’adapter quand les plans changent."],

const OracleLogic=(()=>{
  const GAMES=["logic","mb","mem","echo","slide","math","lights","react"];
  const BESTKEYS=["logic-0","logic-1","logic-2","logic-3","mem-easy","mem-hard","echo","slide-3","slide-4","math","lights","react"];
  const UNITS=["u_moves","u_ms","u_rounds","u_ok","u_pct"];
  const DATE_RE=/^\d{4}-\d{2}-\d{2}$/,TYPE_RE=/^[EI][SN][TF][JP]$/;
  const DAILY_BONUS=50,MAXHIST=20,LM=[1,1.5,2,3];
  const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
  const int=(v,d=0,max=1e9)=>{const n=Number(v);return Number.isFinite(n)?clamp(Math.floor(n),0,max):d};
  const num=v=>typeof v==="number"&&Number.isFinite(v)&&v>=0?Math.round(v):null;

  /* ---------- levels and XP ---------- */
  const stepXp=n=>100+50*(n-1);
  function levelInfo(xp){xp=int(xp);let level=1,rem=xp;while(rem>=stepXp(level)){rem-=stepXp(level);level++}
    return{level,into:rem,need:stepXp(level),pct:Math.round(rem/stepXp(level)*100)}}
  function xpFor(g,r){r=r||{};
    switch(g){
      case"logic":return Math.round((10+4*int(r.ok,0,10))*(LM[clamp(int(r.lv),0,3)]));
      case"mb":return 25;
      case"mem":return 20+Math.max(0,20-2*Math.max(0,int(r.moves)-int(r.pairs)));
      case"echo":return 5*int(r.rounds,0,500);
      case"slide":return (r.n===4?60:30)+(int(r.moves)<=(r.n===4?64:36)?10:0);
      case"math":return 2*int(r.ok,0,500);
      case"lights":return 30+(int(r.moves,999)<=15?15:0);
      case"react":return 25+(int(r.avg,9999)<300?10:0);
    }return 0}

  /* ---------- dates and daily challenge ---------- */
  const dateKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const dayNumber=s=>{const[y,m,d]=s.split("-").map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)};
  const DAILY=[
    {g:"logic",lv:1,key:"logic-1",min:70,k:"d_logic"},{g:"mem",key:"mem-easy",max:12,k:"d_mem"},
    {g:"echo",key:"echo",min:5,k:"d_echo"},{g:"slide",key:"slide-3",max:45,k:"d_slide"},
    {g:"math",key:"math",min:12,k:"d_math"},{g:"lights",key:"lights",max:25,k:"d_lights"},
    {g:"react",key:"react",max:400,k:"d_react"}];
  const dailyFor=ds=>({...DAILY[((dayNumber(ds)%7)+7)%7],date:ds});
  const dailyMet=(d,r)=>r.g===d.g&&r.key===d.key&&(d.min!=null?r.score>=d.min:r.score<=d.max);
  const streakNow=(p,today)=>DATE_RE.test(p.dstreak.last)&&dayNumber(today)-dayNumber(p.dstreak.last)<=1?p.dstreak.count:0;

  const ACH=[

    {id:"perfect",ic:"🎯",test:(p,c)=>!!c&&c.g==="logic"&&c.ok===10},
    {id:"master",ic:"👁️",test:p=>p.best["logic-3"]>=70},
    {id:"sharp",ic:"🃏",test:p=>p.best["mem-hard"]<=14},
    {id:"echo8",ic:"🎵",test:p=>p.best["echo"]>=8},
    {id:"slide4",ic:"🧩",test:p=>p.best["slide-4"]!==undefined},
    {id:"math20",ic:"➕",test:p=>p.best["math"]>=20},
    {id:"lights20",ic:"💡",test:p=>p.best["lights"]<=20},
    {id:"react300",ic:"⚡",test:p=>p.best["react"]<=300},
    {id:"mirror",ic:"🧬",test:p=>p.plays.mb>=1},
    {id:"allround",ic:"🎮",test:p=>GAMES.every(g=>p.plays[g]>=1)},
    {id:"daily3",ic:"📅",test:p=>p.dstreak.best>=3},

  /* ---------- profile: shape, validation, migration ---------- */
  const blank=()=>({v:2,xp:0,runs:0,plays:Object.fromEntries(GAMES.map(g=>[g,0])),best:{},ach:{},hist:[],

    logic:{asked:0,solved:0,bestStreak:0},rids:[],migrated:false});
  function validate(raw){
    const p=blank();if(!raw||typeof raw!=="object")return p;

    Object.entries(raw.best&&typeof raw.best==="object"?raw.best:{}).forEach(([k,v])=>{const n=num(v);if(BESTKEYS.includes(k)&&n!==null)p.best[k]=n});
    ACH.forEach(a=>{const v=Number(raw.ach&&raw.ach[a.id]);if(Number.isFinite(v)&&v>0)p.ach[a.id]=v});
    if(Array.isArray(raw.hist))p.hist=raw.hist.filter(e=>e&&typeof e==="object"&&GAMES.includes(e.g)).slice(0,MAXHIST)

    if(raw.mb&&TYPE_RE.test(raw.mb.type))p.mb={type:raw.mb.type,date:DATE_RE.test(raw.mb.date)?raw.mb.date:""};

    if(Array.isArray(raw.rids))p.rids=raw.rids.filter(x=>typeof x==="string"&&x.length<40).slice(-30);
    p.migrated=raw.migrated===true;

  function migrate(old){ /* old = {g,best,stats,mb} read from the pre-profile storage keys */

    ["mem-easy","mem-hard","echo","slide-3","slide-4","math","lights","react"].forEach(k=>{const v=num(g[k]);if(v!==null)p.best[k]=v});
    for(let i=0;i<4;i++){const v=num(b[i]);if(v!==null&&v<=100)p.best["logic-"+i]=v}
    p.logic={asked:int(s.asked),solved:Math.min(int(s.solved),int(s.asked)),bestStreak:int(s.bestStreak,0,100)};
    Object.keys(p.best).forEach(k=>{const gm=k.startsWith("logic")?"logic":k.split("-")[0];p.plays[gm]=Math.max(p.plays[gm],1)});
    p.plays.logic=Math.max(p.plays.logic,int(s.runs,0,1e6));
    if(TYPE_RE.test(m.type)){p.mb={type:m.type,date:DATE_RE.test(m.date)?m.date:""};p.plays.mb=1}
    p.runs=GAMES.reduce((a,x)=>a+p.plays[x],0);p.migrated=p.runs>0;
    if(p.migrated)ACH.forEach(a=>{if(a.id!=="perfect"&&a.id!=="daily3"&&a.test(p,null))p.ach[a.id]=1});
    return p}

  /* ---------- applying one finished run (idempotent per run id) ---------- */
  function applyRun(prev,r,today,ts){
    const p=validate(prev);
    if(!r||!GAMES.includes(r.g)||typeof r.id!=="string"||!r.id||num(r.score)===null)return{p,s:{rejected:true,xp:0,ach:[]}};
    if(p.rids.includes(r.id))return{p,s:{dup:true,xp:0,ach:[]}};
    const lvBefore=levelInfo(p.xp).level,score=num(r.score),d=r.d||{};
    let xp=xpFor(r.g,d);
    if(r.g==="mb"){if(p.mbDay===today)xp=0;else p.mbDay=today;if(TYPE_RE.test(d.type))p.mb={type:d.type,date:today}}
    let newBest=false;
    if(BESTKEYS.includes(r.key)){const o=p.best[r.key],had=o!==undefined,better=!had||(r.min?score<o:score>o);if(better){p.best[r.key]=score;newBest=had}}
    p.plays[r.g]++;p.runs++;
    if(r.g==="logic"){p.logic.asked+=int(d.asked,0,100);p.logic.solved+=int(d.ok,0,100);p.logic.bestStreak=Math.max(p.logic.bestStreak,int(d.streak,0,100));p.logic.solved=Math.min(p.logic.solved,p.logic.asked)}
    const dl=dailyFor(today);let dailyDone=false;

    if(!p.daily.done&&dailyMet(dl,{g:r.g,key:r.key,score})){
      p.daily.done=true;dailyDone=true;xp+=DAILY_BONUS;
      const consec=DATE_RE.test(p.dstreak.last)&&dayNumber(today)-dayNumber(p.dstreak.last)===1;
      p.dstreak.count=consec?p.dstreak.count+1:1;p.dstreak.last=today;p.dstreak.best=Math.max(p.dstreak.best,p.dstreak.count)}

  /* ---------- pure game generators ---------- */
  function makeMath(level,rand=Math.random){
    const ri=(a,b)=>a+Math.floor(rand()*(b-a+1));
    const op=["+","−","×"][ri(0,level>1?2:1)];let a,b,ans;
    if(op==="+"){a=ri(2,9*level+5);b=ri(2,9*level+5);ans=a+b}
    else if(op==="−"){a=ri(5,9*level+10);b=ri(1,a-1);ans=a-b}
    else{a=ri(2,6+level);b=ri(2,6+level);ans=a*b}

  let moves=0,found=0,open=[],lock=false;
  show(`${gameHead("mem",`<span id="mv" class="ltr">${t("moves")}: 0</span>`)}<p class="hintline">${t("gi_mem")}</p><div class="mem">${cards.map((s,i)=>`<button class="mc" data-i="${i}" aria-label="${t("card",i+1)}"><i class="bk">❔</i><i class="fr">${s}</i></button>`).join("")}</div>`,true);
  exitBtn();const bs=[...app.querySelectorAll(".mc")];
  bs.forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;if(lock||b.classList.contains("up"))return;
    b.classList.add("up");b.setAttribute("aria-label",cards[i]);sfx.click();open.push(i);
    if(open.length<2)return;
    moves++;$("#mv").textContent=t("moves")+": "+moves;const[a,c]=open;open=[];
    if(cards[a]===cards[c]){[a,c].forEach(k=>bs[k].classList.add("ok"));sfx.ok();burst(bs[c],"#5df2d6");announce(t("ann_pair"));
      if(++found===n)finish({id,g:"mem",key,score:moves,min:true,unit:"u_moves",d:{moves,pairs:n},msg:t("mem_done",nf(moves)),again:()=>memPlay(n)})}
    else{lock=true;sfx.no();later(()=>{[a,c].forEach(k=>{bs[k].classList.remove("up");bs[k].setAttribute("aria-label",t("card",k+1))});lock=false},800)}})}

/* ===================== game 4: pattern echo ===================== */
function echoPlay(){
  RR=null;go("mb",true);const id=newRun();
  const cols=["#5df2d6","#b46bff","#ffc86b","#ff6b9d"],fr=[262,330,392,523],seq=[];let pos=0,accept=false,ended=false;
  show(`${gameHead("echo",`<span id="rd" class="ltr"></span>`)}<p class="hintline">${t("gi_echo")}</p><p class="q" id="stt" role="status"></p><div class="pads">${cols.map((c,i)=>`<button class="pad" data-kbd="${i+1}" aria-label="${i+1}" style="--p:${c}"></button>`).join("")}</div>`,true);
  exitBtn();
  const pads=[...app.querySelectorAll(".pad")],wait=ms=>new Promise(r=>later(r,ms)),say=s=>{$("#stt").textContent=s};
  const flash=i=>{pads[i].classList.add("lit");tone(fr[i],.3,"sine",1.2);later(()=>pads[i].classList.remove("lit"),320)};
  const round=async()=>{
    accept=false;seq.push(Math.floor(Math.random()*4));$("#rd").textContent=t("echo_round",seq.length);say(t("echo_watch"));await wait(700);
    for(const i of seq){flash(i);await wait(600)}
    accept=true;pos=0;say(t("echo_you"))};
  pads.forEach((p,i)=>p.onclick=()=>{
    if(!accept||ended)return;flash(i);
    if(i!==seq[pos]){accept=false;ended=true;sfx.no();const d=seq.length-1;say("");
      finish({id,g:"echo",key:"echo",score:d,min:false,unit:"u_rounds",d:{rounds:d},msg:t("echo_over",nf(d)),again:echoPlay,skip:d<1});return}
    if(++pos===seq.length){accept=false;sfx.ok();later(round,800)}});
  round()}

/* ===================== game 5: sliding tiles ===================== */
function slidePlay(n){
  RR=null;go("mb",true);const id=newRun();
  const key="slide-"+n,b=OracleLogic.slideBoard(n);let blank=b.indexOf(0),moves=0,done=false;
  show(`${gameHead("slide",`<span id="mv" class="ltr"></span>`)}<p class="hintline">${t("gi_slide")}</p><div class="tiles" id="tl" style="grid-template-columns:repeat(${n},1fr)"></div><button class="ghost" id="sh" style="display:block;margin:0 auto">${t("shuffle")}</button>`,true);
  exitBtn();
  const draw=()=>{$("#mv").textContent=t("moves")+": "+moves;
    $("#tl").innerHTML=b.map((v,i)=>`<button class="tile ltr${v?"":" blank"}" data-i="${i}" ${v?"":'disabled aria-hidden="true"'}>${v||""}</button>`).join("");
    $("#tl").querySelectorAll(".tile").forEach(x=>x.onclick=()=>move(+x.dataset.i))};
  const move=i=>{if(done||!OracleLogic.slideNbs(blank,n).includes(i))return;[b[blank],b[i]]=[b[i],b[blank]];blank=i;moves++;sfx.click();draw();
    if(OracleLogic.slideSolved(b)){done=true;finish({id,g:"slide",key,score:moves,min:true,unit:"u_moves",d:{n,moves},msg:t("slide_win",nf(moves)),again:()=>slidePlay(n)})}};
  $("#sh").onclick=()=>slidePlay(n);
  const kh=e=>{if(e.ctrlKey||e.metaKey||e.altKey||paused())return;
    const m={ArrowUp:blank+n,ArrowDown:blank-n,ArrowLeft:blank+1,ArrowRight:blank-1}[e.key];
    if(m!==undefined&&OracleLogic.slideNbs(blank,n).includes(m)){e.preventDefault();move(m)}};
  addEventListener("keydown",kh);onLeave(()=>removeEventListener("keydown",kh));draw()}

/* ===================== game 6: math sprint ===================== */
function mathPlay(){
  RR=null;go("iq",true);const id=newRun();
  const TOTAL=45000;let left=TOTAL,last=now(),ok=0,over=false,ans=0;
  show(`${gameHead("math",`<span id="mv" class="ltr"></span>`)}<p class="hintline">${t("gi_math")}</p><div class="tb"><i id="tbi"></i></div><p class="big ltr" id="mq" style="font-size:2.4rem"></p><div class="grid" id="mo" style="grid-template-columns:repeat(2,1fr)"></div>`,true);
  exitBtn();
  const next=()=>{const q=OracleLogic.makeMath(1+Math.floor(ok/4));ans=q.ans;
    $("#mq").textContent=`${q.a} ${q.op} ${q.b}`;$("#mv").textContent=t("math_ok",nf(ok));
    $("#mo").innerHTML=shuffle(q.opts).map(v=>`<button class="opt ltr" data-n="${v}">${v}</button>`).join("");
    $("#mo").querySelectorAll(".opt").forEach(x=>x.onclick=()=>{if(over)return;if(+x.dataset.n===ans){ok++;sfx.ok()}else{left-=3000;sfx.no()}next()})};
  const end=()=>{if(over)return;over=true;clearInterval(tm);$("#mo").innerHTML="";$("#mv").textContent=t("math_ok",nf(ok));
    finish({id,g:"math",key:"math",score:ok,min:false,unit:"u_ok",d:{ok},msg:t("math_done",nf(ok)),again:mathPlay})};
  next();
  tm=setInterval(()=>{const n=now(),dt=n-last;last=n;if(paused())return;left-=dt;   /* wall-clock based, so it cannot drift and pauses while dialogs are open */
    $("#tbi").style.width=Math.max(left/TOTAL,0)*100+"%";if(left<=0)end()},100)}

/* ===================== game 7: lights out ===================== */
function lightsPlay(){
  RR=null;go("menu",true);const id=newRun();
  const N=5,g=OracleLogic.lightsPuzzle();let moves=0,over=false;
  show(`${gameHead("lights",`<span id="mv" class="ltr"></span>`)}<p class="hintline">${t("lights_goal")}</p><div class="lights" id="lg"></div><button class="ghost" id="nw" style="display:block;margin:0 auto">${t("lights_new")}</button>`,true);
  exitBtn();
  const draw=()=>{$("#mv").textContent=t("moves")+": "+moves;
    $("#lg").innerHTML=g.map((v,i)=>`<button class="lt${v?" on":""}" data-i="${i}" aria-pressed="${!!v}" aria-label="${Math.floor(i/N)+1},${i%N+1}"></button>`).join("");
    $("#lg").querySelectorAll(".lt").forEach(b=>b.onclick=()=>{if(over)return;OracleLogic.lightsPress(g,+b.dataset.i);moves++;sfx.click();draw();
      if(g.every(x=>!x)){over=true;finish({id,g:"lights",key:"lights",score:moves,min:true,unit:"u_moves",d:{moves},msg:t("lights_win",nf(moves)),again:lightsPlay})}})};
  $("#nw").onclick=lightsPlay;draw()}

/* ===================== game 8: reaction test ===================== */
function reactPlay(){
  RR=null;go("menu",true);const id=newRun();
  let round=0,state="idle",t0=0;const res=[];
  show(`${gameHead("react")}<p class="hintline">${t("react_intro")}</p><p class="q" id="rq">${t("react_round",1)}</p><button class="react" id="rb">${t("react_tap")}</button>`,true);
  exitBtn();const rb=$("#rb");
  const setS=(cls,txt)=>{rb.className="react "+cls;rb.textContent=txt};
  const arm=delay=>{state="wait";setS("wait",t("react_wait"));
    later(()=>{if(paused()){arm(800);return}state="go";setS("go",t("react_go"));announce(t("react_go"));t0=now()},delay)};   /* never goes green behind a dialog */
  rb.onclick=()=>{
    if(state==="idle")arm(1500+Math.random()*2500);
    else if(state==="wait"){TMO.forEach(clearTimeout);TMO.clear();state="idle";setS("wait",t("react_early"));sfx.no()}
    else if(state==="go"){const ms=Math.round(now()-t0);res.push(ms);round++;sfx.click();
      if(round===5){const st=OracleLogic.reactStats(res);state="done";rb.disabled=true;
        finish({id,g:"react",key:"react",score:st.avg,min:true,unit:"u_ms",d:{avg:st.avg},msg:t("react_done",nf(st.avg)),again:reactPlay,
          extra:`<p class="ltr">${t("react_list",res.join(" · "))}</p><p class="ltr">${t("react_best",nf(st.best))}</p>`})}
      else{state="idle";setS("",t("react_ms",nf(ms)));$("#rq").textContent=t("react_round",round+1)}}}}

/* ===================== boot ===================== */
function boot(){
  try{Profile.load();BANK=PuzzleEngine.buildBanks(2026);if(BANK.length!==4||BANK.some(b=>b.length<10))throw new Error(t("err_bank"));welcome()}
  catch(err){fatal(err.message)}}
(()=>{const saved=store.get("oracle-lang",null),nav=(navigator.language||"en").slice(0,2);
  I18N.set(LANGS.includes(saved)?saved:LANGS.includes(nav)?nav:"en");applyLang()})();
addEventListener("error",e=>fatal(e.message||"Unexpected error"));
addEventListener("unhandledrejection",e=>fatal(String(e.reason)));
setTimeout(boot,0);
})();
</script>
